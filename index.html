<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>WiFi Zone Manager</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--txt:#0b1b3a;--mut:#56637c;--line:#d6deeb;--acc:#1b5fc1;--navy:#0a1f44;--ok:#1d7f48;--bad:#b3261e;--warn:#9a5b00;--f-v:#2e7d32;--f-j:#1b5fc1;--f-s:#c65000;--f-m:#6a1b9a}
@media (prefers-color-scheme:dark){:root{--bg:#08111f;--card:#0f1b2e;--txt:#e7edf7;--mut:#9aa8c0;--line:#22324d;--acc:#5a95f0;--navy:#0f1b2e;--ok:#5fd08f;--bad:#ff8a80;--warn:#f2b54f;--f-v:#5cc163;--f-j:#5a95f0;--f-s:#ff9a4d;--f-m:#c38df0}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h1{margin:0;font-size:18px}header small{opacity:.85}
main{max-width:640px;margin:auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:8px 0;font-size:10px;cursor:pointer}nav button[data-v=tix]{color:var(--acc);font-weight:700}nav button[data-v=tix] b{background:var(--acc);border-radius:12px;padding:0 6px;display:inline-block;line-height:1.35}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{color:var(--mut);display:block}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2{font-size:15px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{display:block;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fo button{--c:var(--acc);border:2px solid var(--c);background:var(--card);color:var(--c);border-radius:12px;padding:16px 6px;font-size:16px;font-weight:700;cursor:pointer}
.fo button small{display:block;font-weight:400;color:var(--mut)}.fo button.on{background:var(--c);color:#fff}@media (prefers-color-scheme:dark){.fo button.on{color:#06101f}.fo button.on small{color:#06101f}}.fo button.on small{color:#fff}.fo button small{color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);margin-top:4px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
.btn.full{width:100%;margin-top:12px}.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}.btn.del{background:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bar .btn{flex:1}
.qty{display:flex;align-items:center;gap:12px;margin:8px 0}.qty button{width:48px;height:48px;font-size:24px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
.qty b{font-size:26px;min-width:44px;text-align:center}
.total{font-size:30px;font-weight:800}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,460px);background:var(--card);color:var(--txt)}
dialog::backdrop{background:#0008}dialog h3{margin:0 0 6px}
.end{display:flex;gap:8px;margin-top:14px}.end .btn{flex:1}
#lock{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}#lock.on{display:flex}#lock h2{color:#fff;font-size:22px;margin:0 0 4px;text-transform:none;letter-spacing:0}#lock p{opacity:.85;margin:0 0 16px;min-height:22px}
.dots{display:flex;gap:12px;margin:8px 0 18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{width:72px;height:72px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:24px;font-weight:600;cursor:pointer}.pad button:active{background:#ffffff55}
#lock .lnk{background:none;border:0;color:#fff;opacity:.8;margin-top:18px;text-decoration:underline;font-size:14px;cursor:pointer}
#syncBtn{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;float:right;margin-top:-34px;padding:6px}
#upd{position:fixed;left:12px;right:12px;bottom:92px;max-width:520px;margin:0 auto;z-index:30;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 4px 18px #0006}#upd span{flex:1;font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:24px 0}
@media print{header,nav,.noprint{display:none!important}body{padding:0;background:#fff}}
#planche{display:none}
@media print{body.imprime>*:not(#planche){display:none!important}body.imprime{background:#fff;color:#000;padding:0}body.imprime #planche{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.tk{border:1px dashed #666;padding:10px 6px;text-align:center;font:11px/1.35 Arial,sans-serif;color:#000;page-break-inside:avoid}.tk b{display:block;font:700 20px/1.4 'Courier New',monospace;letter-spacing:2px;margin:4px 0}.tk small{display:block;color:#333}}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:#fff}
</style>
</head>
<body>
<header><button id="syncBtn" title="Synchronisation" aria-label="Synchronisation">☁️</button><h1 id="ttl">WiFi Zone</h1><small id="sub"></small></header>
<main id="view"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="planche"></div>
<div id="lock"></div>
<div id="toast"></div>
<script>
// WiFi Zone Manager: single-file PWA (sales of tickets, expenses, daily closing, reports). Data stays in this browser (localStorage).
(() => {
  'use strict';
  const $ = id => document.getElementById(id), KEY = 'wifizone-v1', VERSION = 'v10'; // VERSION must match CACHE in sw.js
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const fdate = s => s ? s.split('-').reverse().join('/') : '—';
  const nf = (n, d = 0) => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }).format(n).replace(/[  ]/g, ' ');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const MODES = ['Cash', 'M-Pesa', 'Airtel Money', 'Orange Money', 'Banque'], CATS = ['Abonnement Starlink', 'Électricité / carburant', 'Salaire', 'Matériel / réparation', 'Papier / impression', 'Autre'];
  const blank = () => ({ v: 1, name: 'WiFi Zone', rate: 2400, lastBackup: '', pin: null, lockMin: 2, forfaits: [
    { id: 'V', nom: 'Visiteur', duree: '6 heures', prix: 500 }, { id: 'J', nom: 'Jour', duree: '24 heures', prix: 1000 },
    { id: 'S', nom: 'Semaine', duree: '7 jours', prix: 7000 }, { id: 'M', nom: 'Mois', duree: '30 jours', prix: 30000 }], sales: [], expenses: [], closings: [], tickets: [], lots: [], server: 'hotspot-cispol', seuil: 10 });
  let db; try { db = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { db = blank(); }
  // forfaits: stable order for sync, plus the ticket-code letter and the MikroTik profile (defaults follow the CISPOLstore router)
  const PROFILS = { V: 'Visiteur-6H', J: 'Jour-24H', S: 'Semaine-7J', M: 'Mois-30J' };
  db.forfaits.forEach((f, i) => { if (!f.ts) f.ts = i + 1; if (!f.letter) f.letter = (f.id in PROFILS) ? f.id : ''; if (f.profil == null) f.profil = PROFILS[f.id] || ''; });
  db.forfaits.forEach(f => { if (!f.letter) f.letter = freeLetter(f.nom, f); });
  function freeLetter(nom, self) { const used = new Set(db.forfaits.filter(x => x !== self).map(x => x.letter)); for (const c of (nom.toUpperCase().replace(/[^A-Z]/g, '') + 'ABCDEFGHJKLMNPQRSTUVWXYZ')) if (!used.has(c)) return c; return 'X'; }
  const save = () => { if (window.__afterSave) window.__afterSave(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Stockage plein : faites une sauvegarde'); } };
  const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); };
  // money: every record keeps its own currency and the rate of the day it was made
  const toCDF = (n, cur, rate) => cur === 'USD' ? n * (rate || db.rate) : n;
  const fmt = (n, cur = 'CDF') => cur === 'USD' ? `${nf(n, Math.abs(n % 1) > .004 ? 2 : 0)} $` : `${nf(n)} FC`;
  const usdOf = cdf => cdf / db.rate;
  const both = cdf => `${fmt(cdf)} <small>≈ ${fmt(usdOf(cdf), 'USD')}</small>`;

  const st = { tab: 'home', sper: 'day', sq: '', tfid: 'J', tn: 50, per: 'day', fid: '', qty: 1, mode: 'Cash', cd: today(), rm: today().slice(0, 7) };
  const range = per => { const t = today(); if (per === 'day') return [t, t]; if (per === 'week') return [addDays(t, -6), t]; return [t.slice(0, 7) + '-01', t]; };
  const inR = (d, r) => d >= r[0] && d <= r[1];
  const saleCDF = s => s.amount, expCDF = e => toCDF(e.amount, e.cur, e.rate);
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  // forfait colors follow the WiFi tools palette: green / blue / orange / purple, then cycling
  const FCOL = ['var(--f-v)', 'var(--f-j)', 'var(--f-s)', 'var(--f-m)'], FBYID = { V: 0, J: 1, S: 2, M: 3 };
  const fcol = f => FCOL[f.id in FBYID ? FBYID[f.id] : Math.max(0, db.forfaits.indexOf(f)) % 4];
  const fname = id => (db.forfaits.find(f => f.id === id) || { nom: 'Forfait supprimé' }).nom;

  // ---------- modal ----------
  const dlg = $('dlg');
  const modal = (title, body, onOk, okLabel = 'Enregistrer') => {
    dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${body}<div class="end"><button type="button" class="btn sec" id="dno">${onOk ? 'Annuler' : 'Fermer'}</button>${onOk ? `<button class="btn" id="dok">${okLabel}</button>` : ''}</div></form>`;
    $('dno').onclick = () => dlg.close();
    dlg.querySelector('form').onsubmit = e => { e.preventDefault(); if (onOk && onOk() === false) return; dlg.close(); };
    if (!dlg.open) dlg.showModal();
  };
  const chips = (act, cur, items) => `<div class="chips">${items.map(([k, t]) => `<button class="chip ${cur === k ? 'on' : ''}" data-a="${act}" data-v="${esc(k)}">${esc(t)}</button>`).join('')}</div>`;

  // ---------- views ----------
  const views = {};
  views.home = () => {
    const r = range(st.per), S = db.sales.filter(s => inR(s.date, r)), E = db.expenses.filter(e => inR(e.date, r));
    const inc = sum(S, saleCDF), out = sum(E, expCDF), net = inc - out, tickets = sum(S, s => s.qty);
    const byF = {}; S.forEach(s => { const o = byF[s.fid] = byF[s.fid] || { q: 0, a: 0 }; o.q += s.qty; o.a += s.amount; });
    const byM = {}; S.forEach(s => byM[s.mode] = (byM[s.mode] || 0) + s.amount);
    const stale = !db.lastBackup || (Date.now() - db.lastBackup) > 3 * 864e5;
    return { title: db.name, sub: fdate(r[0]) + (r[0] !== r[1] ? ' → ' + fdate(r[1]) : ''), html: `
      ${stale && (db.sales.length || db.expenses.length) ? `<div class="card warn" data-a="goset" style="cursor:pointer">⚠ Pas de sauvegarde récente. Touchez ici pour sauvegarder vos données.</div>` : ''}
      <button class="btn full" data-a="tab" data-v="tix" style="margin:0 0 12px">🎟 Générer des tickets <small style="font-weight:400">(stock : ${db.tickets.filter(t => t.status === 'stock' && lotImported(t.lot)).length})</small></button>
      ${dupBanner()}${pendBanner()}
      ${lowStock().length ? `<div class="card warn" data-a="tab" data-v="tix" style="cursor:pointer">🎟 Stock de tickets bas : ${lowStock().map(f => `${esc(f.nom)} (${stockOf(f.id).length})`).join(', ')}. Touchez ici pour générer un lot.</div>` : ''}
      ${chips('per', st.per, [['day', "Aujourd'hui"], ['week', '7 jours'], ['month', 'Ce mois']])}
      <div class="grid"><div class="stat"><small>Ventes</small><b class="ok">${fmt(inc)}</b><small>${tickets} ticket(s)</small></div><div class="stat"><small>Dépenses</small><b class="bad">${fmt(out)}</b><small>${E.length} dépense(s)</small></div></div>
      <div class="card"><small class="mut">Bénéfice</small><div class="total ${net >= 0 ? 'ok' : 'bad'}">${fmt(net)}</div><div class="mut">≈ ${fmt(usdOf(net), 'USD')} (1 $ = ${nf(db.rate)} FC)</div></div>
      <h2>Par forfait</h2><div class="card">${Object.keys(byF).length ? Object.entries(byF).map(([id, o]) => `<div class="row"><div class="g"><b><span style="color:${fcol(db.forfaits.find(f => f.id === id) || { id })}">●</span> ${esc(fname(id))}</b><small>${o.q} ticket(s)</small></div><b>${fmt(o.a)}</b></div>`).join('') : '<div class="empty">Aucune vente sur cette période.</div>'}</div>
      <h2>Par mode de paiement</h2><div class="card">${Object.keys(byM).length ? Object.entries(byM).map(([m, a]) => `<div class="row"><div class="g">${esc(m)}</div><b>${fmt(a)}</b></div>`).join('') : '<div class="empty">—</div>'}</div>
      <button class="btn sec full" data-a="tab" data-v="sales" style="margin-top:0">📋 Voir chaque vente (heure, code)</button>` };
  };
  // ---------- Tickets: stock of hotspot codes per forfait ----------
  // Code = forfait letter + 5 characters (no 0/O/1/I), same rule as the router. Comment stays empty on purpose (the router script writes the expiry there).
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  // a lot only counts as sellable stock once it has been imported into the router (older lots without the flag count as imported)
  const lotImported = id => { const l = db.lots.find(x => x.id === id); return !l || l.imported !== false; };
  const stockOf = fid => db.tickets.filter(t => t.fid === fid && t.status === 'stock' && lotImported(t.lot));
  const pendingLots = () => db.lots.filter(l => l.imported === false);
  const pendingOf = fid => db.tickets.filter(t => t.fid === fid && t.status === 'stock' && !lotImported(t.lot)).length;
  const hasLots = fid => db.lots.some(l => l.fid === fid);
  const newCode = prefix => { const b = crypto.getRandomValues(new Uint8Array(5)); return prefix + [...b].map(x => ALPHA[x % ALPHA.length]).join(''); };
  const genLot = (f, n) => {
    const taken = new Set([...db.tickets.map(t => t.code), ...db.sales.flatMap(x => String(x.ref || '').split(' '))]), codes = [];
    while (codes.length < n) { const c = newCode(f.letter || 'X'); if (!taken.has(c)) { taken.add(c); codes.push(c); } }
    const lot = { id: 'L' + Date.now().toString(36), ts: Date.now(), fid: f.id, n, codes };
    const t0 = Date.now(); db.lots.push({ id: lot.id, ts: lot.ts, fid: f.id, n, imported: false });
    codes.forEach((code, i) => db.tickets.push({ id: code, code, ts: t0 + i, fid: f.id, lot: lot.id, status: 'stock' }));
    save(); return lot;
  };
  const lotCodes = lotId => db.tickets.filter(t => t.lot === lotId).sort((a, b) => a.ts - b.ts);
  const rscOf = (f, lot) => ['# Lot ' + lot.id + ' - ' + f.nom + ' - ' + lotCodes(lot.id).length + ' tickets', ...lotCodes(lot.id).map(t => `/ip hotspot user add name=${t.code} password=${t.code} profile=${f.profil} server=${db.server}`)].join('\n') + '\n';
  const printLot = (f, lot) => { $('planche').innerHTML = lotCodes(lot.id).map(t => `<div class="tk">${esc(db.name)}<b>${esc(t.code)}</b>${esc(f.nom)} · ${esc(f.duree)} · ${fmt(f.prix)}<small>Connectez-vous au WiFi puis saisissez ce code</small></div>`).join(''); document.body.classList.add('imprime'); window.print(); document.body.classList.remove('imprime'); };
  const lowStock = () => db.forfaits.filter(f => hasLots(f.id) && stockOf(f.id).length < (db.seuil || 0));
  // a code sold twice (two phones sold the same ticket while offline): the later sale gets another ticket
  const dupSales = () => { const seen = new Set(), out = []; db.sales.slice().sort((a, b) => a.ts - b.ts).forEach(x => (x.codes || []).forEach(c => { if (seen.has(c)) out.push({ sale: x, code: c }); else seen.add(c); })); return out; };
  const pendBanner = () => pendingLots().length ? `<div class="card warn" data-a="tab" data-v="tix" style="cursor:pointer">📥 ${pendingLots().length} lot(s) de tickets pas encore importé(s) dans le routeur (${pendingLots().map(l => esc((db.forfaits.find(x => x.id === l.fid) || { nom: '?' }).nom) + ' × ' + l.n).join(', ')}). Ces codes ne sont pas vendus tant que vous n'avez pas coché « Importé ».</div>` : '';
  const dupBanner = () => dupSales().length ? `<div class="card warn" data-a="fixdup" style="cursor:pointer">⚠ ${dupSales().length} code(s) vendu(s) deux fois (${dupSales().map(d => esc(d.code)).join(', ')}). Touchez ici pour donner un autre code au second client.</div>` : '';
  views.tix = () => {
    const f = db.forfaits.find(x => x.id === st.tfid) || db.forfaits[0], lots = db.lots.slice().sort((a, b) => b.ts - a.ts).slice(0, 12);
    return { title: 'Tickets', sub: 'Stock de codes WiFi', html: `
      ${dupBanner()}${pendBanner()}
      <h2>🎟 Générer des tickets</h2><div class="card"><label>Forfait</label><select id="t_f">${db.forfaits.map(x => `<option value="${esc(x.id)}" ${x.id === f.id ? 'selected' : ''}>${esc(x.nom)} (${esc(x.duree)})</option>`).join('')}</select>
        <label>Nombre de tickets (1 à 300)</label><input id="t_n" type="number" inputmode="numeric" min="1" max="300" value="${st.tn}">
        <button class="btn full" data-a="genlot">🎟 Générer le lot</button>
        <p class="mut" style="margin-bottom:0">Après la génération : téléchargez le fichier <b>.rsc</b>, importez-le dans le routeur (Winbox → Files → glisser le fichier → New Terminal : <code>/import file-name=…</code>), puis imprimez les tickets.</p></div>
      <h2>Stock</h2><div class="card">${db.forfaits.map(x => { const n = stockOf(x.id).length, low = hasLots(x.id) && n < (db.seuil || 0); return `<div class="row"><div class="g"><b><span class="badge" style="background:${fcol(x)}">${esc(x.letter)}</span> ${esc(x.nom)}</b><small>${esc(x.duree)} · profil ${esc(x.profil || '—')}</small></div><b class="${low ? 'bad' : n ? 'ok' : ''}">${n} ticket(s)${low ? ' ⚠' : ''}${pendingOf(x.id) ? `<small style="font-weight:400" class="warn">+ ${pendingOf(x.id)} à importer</small>` : ''}</b></div>`; }).join('')}</div>

    saveset: () => { const r = Math.round(+$('s_rate').value); if (!(r > 0)) return toast('Taux invalide'); db.name = $('s_name').value.trim() || 'WiFi Zone'; db.rate = r; db.server = $('s_server').value.trim() || 'hotspot-cispol'; db.seuil = Math.max(0, parseInt($('s_seuil').value, 10) || 0); save(); draw(); toast('Réglages enregistrés'); },
    newf: () => forfaitForm(null), editf: v => forfaitForm(db.forfaits.find(f => f.id === v)),
    backup: () => { db.lastBackup = Date.now(); save(); download(`wifizone-sauvegarde-${today()}.json`, JSON.stringify({ ...db, pin: null }), 'application/json'); draw(); toast('Sauvegarde téléchargée'); },
    impcsv: () => $('ifile').click(),
    fixdup: () => { const d = dupSales(), done = [];
      d.forEach(({ sale, code }) => { const f = db.forfaits.find(x => x.id === sale.fid), nt = f && stockOf(f.id)[0]; if (!nt) return; nt.status = 'sold'; nt.saleId = sale.id; nt.soldAt = Date.now(); sale.codes = sale.codes.map(c => c === code ? nt.code : c); sale.ref = sale.codes.join(' '); done.push({ f, code: nt.code, old: code }); });
      save(); draw(); if (!done.length) return toast('Plus de ticket en stock : générez un lot');
      modal('Nouveaux codes à donner', `<p class="mut" style="margin-top:0">Ces clients avaient reçu un code déjà vendu. Donnez-leur le nouveau code :</p>${done.map(x => `<div class="row"><div class="g"><small>${esc(x.f.nom)} · remplace ${esc(x.old)}</small></div><b style="font-family:monospace;font-size:20px">${esc(x.code)}</b></div>`).join('')}`); },
    genlot: () => { const f = db.forfaits.find(x => x.id === $('t_f').value), n = Math.min(300, Math.max(1, parseInt($('t_n').value, 10) || 0)); if (!f) return;
      if (!f.profil) return toast('Renseignez d\'abord le profil MikroTik de ce forfait (Réglages → ✎)'); st.tfid = f.id; st.tn = n;
      const lot = genLot(f, n); draw(); download(`tickets-${f.nom}-${lot.id}.rsc`, rscOf(f, lot), 'text/plain;charset=utf-8'); toast(`${n} tickets ${f.nom} générés : importez le fichier .rsc dans le routeur`); },
    lotimp: v => { const l = db.lots.find(x => x.id === v); if (!l) return;
      if (l.imported === false) { l.imported = true; l.importedAt = Date.now(); save(); draw(); return toast('Lot importé : ses tickets sont maintenant en vente'); }
      if (db.tickets.some(t => t.lot === l.id && t.status === 'sold')) { draw(); return toast('Des tickets de ce lot sont déjà vendus : on ne peut plus le repasser « à importer »'); }
      l.imported = false; delete l.importedAt; save(); draw(); },
    lotrsc: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (f) download(`tickets-${f.nom}-${l.id}.rsc`, rscOf(f, l), 'text/plain;charset=utf-8'); },
    lotprint: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (f) printLot(f, l); },
    lotcsv: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (f) download(`tickets-${f.nom}-${l.id}.csv`, '\ufeff' + ['Code;Forfait;Prix FC;Statut', ...lotCodes(l.id).map(t => `${t.code};${f.nom};${f.prix};${t.status === 'sold' ? 'Vendu' : 'En stock'}`)].join('\n'), 'text/csv'); },
    syncnow: async () => { toast('Synchronisation…'); toast(await SY.now()); },
    syncoff: () => { if (confirm('Déconnecter la synchronisation ? Les données restent sur ce téléphone.')) { SY.disconnect(); draw(); } },
    syncsql: () => { fetch('sync/supabase.sql').then(r => r.text()).then(t => { try { navigator.clipboard.writeText(t); toast('Script SQL copié'); } catch (e) { toast('Copie impossible'); } }).catch(() => toast('Script indisponible')); },
    syncsetup: () => modal('Synchronisation', `<div class="card" style="font-size:14px"><b>Déjà configuré pour CISPOLstore Manager ?</b> Utilisez la même URL et la même clé, avec le nom d'espace <b>wifizone</b> : rien d'autre à faire.<br><br><b>Sinon (une seule fois, 5 minutes)</b>
        <ol style="margin:8px 0 0;padding-left:18px"><li>Compte gratuit sur <b>supabase.com</b>, puis un nouveau projet.</li><li><b>SQL Editor</b> → New query → collez le script → <b>Run</b>.</li><li><b>Project Settings → API</b> : copiez l'URL du projet et la clé <b>anon / publishable</b>.</li></ol>
        <div class="bar"><button type="button" class="btn sec sm" data-a="syncsql">📋 Copier le script SQL</button></div><p style="margin-bottom:0">Sur chaque autre téléphone, saisissez <b>exactement les mêmes 4 valeurs</b>.</p></div>
        <label>URL du projet Supabase</label><input id="y_url" value="${esc(cfg ? cfg.url : '')}" placeholder="https://xxxx.supabase.co" autocapitalize="none" autocomplete="off">
        <label>Clé publique (anon / publishable)</label><input id="y_anon" value="${esc(cfg ? cfg.anon : '')}" autocapitalize="none" autocomplete="off">
        <label>Nom de l'espace</label><input id="y_ws" value="${esc(cfg ? cfg.ws : 'wifizone')}" autocapitalize="none" autocomplete="off">
        <label>Phrase secrète (8 caractères minimum)</label><input id="y_pass" type="password" autocomplete="off">
        <p class="mut" style="font-size:13px">Les données sont chiffrées avec cette phrase avant l'envoi : sans elle, personne (même Supabase) ne peut les lire. <b>Notez-la</b> : elle ne peut pas être récupérée.</p><p id="y_msg" class="warn"></p>`, () => {
        const msg = $('y_msg'), btn = $('dok'); msg.textContent = ''; btn.disabled = true; btn.textContent = 'Connexion…';
        SY.connect({ url: $('y_url').value, anon: $('y_anon').value, ws: $('y_ws').value, pass: $('y_pass').value }).then(r => { dlg.close(); toast('Synchronisation activée : ' + r); draw(); }).catch(e => { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Connecter'; });
        return false; }, 'Connecter'),
    setpin: () => verifyThen(newPin), lockn: () => unlockScreen(), rmpin: () => verifyThen(() => { if (confirm('Supprimer le code PIN ?')) { db.pin = null; save(); draw(); toast('Code PIN supprimé'); } else draw(); }),
    // forget the cached copy of the app (service worker + caches, never the data) and reload the latest version
    update: async () => { toast('Mise à jour…');
      try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(x => x.unregister())); } catch (e) {}
      try { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('wifizone-')).map(k => caches.delete(k))); } catch (e) {}
      location.replace(location.pathname + '?maj=' + Date.now()); },
    reload: () => location.reload(),
    restore: () => $('rfile').click()
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset.v); });
  document.addEventListener('change', e => {
    if (e.target.id === 'ifile' && e.target.files[0]) {
      const mode = $('i_mode').value, rd = new FileReader();
      rd.onload = () => { try { const x = importSales(String(rd.result), mode); draw(); toast(x.added ? `${x.added} vente(s) importée(s) : ${fmt(x.total)}${x.dup ? ` · ${x.dup} déjà présente(s)` : ''}${x.newF ? ` · ${x.newF} forfait(s) créé(s)` : ''}` : `Rien à importer${x.dup ? ` (${x.dup} déjà présente(s))` : ''}`); } catch (er) { toast(er.message || 'Fichier invalide'); } };
      rd.readAsText(e.target.files[0]); e.target.value = ''; return;
    }
    if (e.target.id === 's_lock') { db.lockMin = +e.target.value; save(); toast('Enregistré'); return; }
    if (e.target.id !== 'rfile' || !e.target.files[0]) return;
    const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!Array.isArray(d.sales) || !Array.isArray(d.expenses)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.sales.length} vente(s), ${d.expenses.length} dépense(s)) ?`)) return; db = { ...blank(), ...d, pin: db.pin, lockMin: db.lockMin }; save(); draw(); toast('Sauvegarde restaurée'); } catch (x) { toast('Fichier invalide'); } };
    rd.readAsText(e.target.files[0]); e.target.value = '';
  });
  const sb = $('syncBtn'); if (sb) { setStatus(SY.status); sb.onclick = () => { if (!cfg) A.tab('set'); else A.syncnow(); }; }
  draw(); unlockScreen(); if (cfg) schedule(1500);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // a new version was installed in the background: offer to reload (the open page still shows the old one)
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { const first = !hadController; hadController = true; if (!first && !$('upd')) { const d = document.createElement('div'); d.id = 'upd'; d.className = 'noprint'; d.innerHTML = '<span>Nouvelle version disponible</span><button class="btn sm" data-a="reload">Actualiser</button>'; document.body.appendChild(d); } });
    navigator.serviceWorker.register('sw.js').then(reg => reg.update().catch(() => {})).catch(() => {});
  }
})();
</script>
</body>
</html>
