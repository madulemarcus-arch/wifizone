<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0a1f44">
<script>try{var t=localStorage.getItem('wifizone-theme');if(t==='light'||t==='dark'||t==='noir')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">

<title>WiFi Zone Manager</title>
<style>
:root{
  --bg:#eef3fb;--bg2:#e4ecf8;--card:#fff;--txt:#0c1a33;--mut:#5b6b87;--line:#dbe4f2;
  --acc:#1f6feb;--acc2:#4f8cff;--navy:#0a1f44;--navy2:#123a7a;
  --ok:#14804a;--bad:#c0332b;--warn:#a5600a;--okbg:#e6f6ee;--badbg:#fdecea;--warnbg:#fff3df;
  --f-v:#2e8b3a;--f-j:#1f6feb;--f-s:#d9600b;--f-m:#7b2cbf;
  --sh:0 1px 2px rgba(12,26,51,.06),0 10px 28px rgba(12,26,51,.07);--shs:0 1px 2px rgba(12,26,51,.08),0 4px 12px rgba(12,26,51,.08);
  --r:18px;--g:linear-gradient(135deg,#1f6feb,#4f8cff)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#070e1c;--bg2:#0b1530;--card:#101c33;--txt:#e9eff9;--mut:#9fb0cc;--line:#21324f;
  --acc:#5b9bff;--acc2:#82b4ff;--navy:#0b1730;--navy2:#143266;
  --ok:#5fd69a;--bad:#ff8f86;--warn:#f5bf5c;--okbg:#0f2a1f;--badbg:#321615;--warnbg:#2f2410;
  --f-v:#5fc96b;--f-j:#6aa3ff;--f-s:#ff9b4f;--f-m:#c58cf5;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--shs:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  --g:linear-gradient(135deg,#2f7bf0,#5b9bff)}}
:root[data-theme=dark]{
  --bg:#070e1c;--bg2:#0b1530;--card:#101c33;--txt:#e9eff9;--mut:#9fb0cc;--line:#21324f;
  --acc:#5b9bff;--acc2:#82b4ff;--navy:#0b1730;--navy2:#143266;
  --ok:#5fd69a;--bad:#ff8f86;--warn:#f5bf5c;--okbg:#0f2a1f;--badbg:#321615;--warnbg:#2f2410;
  --f-v:#5fc96b;--f-j:#6aa3ff;--f-s:#ff9b4f;--f-m:#c58cf5;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--shs:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  --g:linear-gradient(135deg,#2f7bf0,#5b9bff)}
:root[data-theme=noir]{
  --bg:#070e1c;--bg2:#0b1530;--card:#101c33;--txt:#e9eff9;--mut:#9fb0cc;--line:#21324f;
  --acc:#5b9bff;--acc2:#82b4ff;--navy:#0b1730;--navy2:#143266;
  --ok:#5fd69a;--bad:#ff8f86;--warn:#f5bf5c;--okbg:#0f2a1f;--badbg:#321615;--warnbg:#2f2410;
  --f-v:#5fc96b;--f-j:#6aa3ff;--f-s:#ff9b4f;--f-m:#c58cf5;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--shs:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  --g:linear-gradient(135deg,#2f7bf0,#5b9bff);--bg:#000;--bg2:#06070b;--card:#0b0d12;--line:#1b2030;--navy:#000;--navy2:#0d1a33;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -120px,var(--bg2),var(--bg)) fixed;color:var(--txt);padding-bottom:112px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;color:#fff;padding:16px 20px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));background:radial-gradient(500px 220px at 85% -40%,#3b82f655,transparent),linear-gradient(135deg,var(--navy),var(--navy2));border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(10,31,68,.28)}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
header h1::before{content:"";width:38px;height:38px;flex:none;background:url(logo.svg) center/contain no-repeat;filter:drop-shadow(0 2px 6px #0006)}
header small{opacity:.8;font-size:13px;display:block;margin:2px 0 0 48px}
main{max-width:660px;margin:auto;padding:16px 16px 8px}
main>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px rgba(10,20,40,.22);z-index:5;padding:4px 2px}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:6px 0 5px;font-size:10px;font-weight:500;cursor:pointer;border-radius:18px;transition:color .15s}
nav button b{display:block;font-size:19px;font-weight:400;transition:transform .15s}
nav button.on{color:var(--acc);font-weight:700}nav button.on b{transform:translateY(-1px) scale(1.12)}
nav button[data-v=tix]{color:var(--acc);font-weight:800}
nav button[data-v=tix] b{background:var(--g);border-radius:16px;padding:0 8px;display:inline-block;line-height:1.5;margin-top:-18px;box-shadow:0 6px 16px rgba(31,111,235,.45);border:3px solid var(--bg);font-size:20px}
nav button[data-v=tix].on b{transform:scale(1.06)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.warn{background:var(--warnbg);border-color:transparent;color:var(--warn);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--mut);display:block;font-size:12.5px}.stat b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block;margin:2px 0}
.grid .stat:first-child{background:linear-gradient(180deg,var(--okbg),var(--card))}.grid .stat:nth-child(2){background:linear-gradient(180deg,var(--badbg),var(--card))}
.keep{font-size:1.35em;font-weight:800;letter-spacing:-.02em;color:var(--ok)}.hero .keep{color:#fff;background:rgba(255,255,255,.24);padding:1px 9px;border-radius:10px;display:inline-block;margin:2px 0}.keeprow{background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:12px;padding:6px 10px!important}.loanrow{flex-wrap:wrap;gap:6px 10px}.loanrow .lt{flex:1 1 100%;display:flex;align-items:flex-start;gap:10px}.loanrow .lt .g{flex:1;min-width:0}.loanrow > small{flex:1 1 100%;color:var(--mut);overflow-wrap:anywhere}.loanrow .lb{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px}.loanrow .lb .btn{flex:1 1 auto}.loanrow .lt [data-a=delloan]{flex:none}
@media (max-width:480px){nav button{font-size:9px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2 a{white-space:nowrap;flex:none}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;margin:22px 4px 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:22px;width:fit-content;max-width:100%;box-shadow:var(--shs)}
.chip{border:0;background:none;color:var(--mut);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s}
.chip.on{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(31,111,235,.4)}
.fo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fo button{--c:var(--acc);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:var(--r);padding:18px 8px 16px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.fo button::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.fo button small{display:block;font-weight:500;color:var(--mut);font-size:13px;margin-top:2px}
.fo button:active{transform:scale(.97)}
.fo button.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));color:#fff;border-color:transparent;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 45%,transparent)}
.fo button.on::before{height:0}.fo button.on small{color:#ffffffd9}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .fo button.on{color:#07101f}:root:not([data-theme]) .fo button.on small{color:#07101fcc}}:root[data-theme=dark] .fo button.on,:root[data-theme=noir] .fo button.on{color:#07101f}:root[data-theme=dark] .fo button.on small,:root[data-theme=noir] .fo button.on small{color:#07101fcc}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px;font-weight:600}
input,select{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--txt);margin-top:5px;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn{border:0;border-radius:15px;padding:15px 16px;font-size:16px;font-weight:700;background:var(--g);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(31,111,235,.32);transition:transform .12s,box-shadow .12s,opacity .15s;font-family:inherit}
.btn:active{transform:scale(.97)}.btn[disabled]{box-shadow:none}
.btn.full{width:100%;margin-top:14px}
.btn.sec{background:var(--card);color:var(--txt);border:1.5px solid var(--line);font-weight:600;box-shadow:var(--shs)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px;box-shadow:var(--shs)}
.btn.del{background:linear-gradient(135deg,#c0332b,#e5594f);box-shadow:0 8px 20px rgba(192,51,43,.3)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.bar .btn{flex:1}
.qty{display:flex;align-items:center;gap:14px;margin:6px 0 10px}.qty button{width:52px;height:52px;font-size:26px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--txt);cursor:pointer;box-shadow:var(--shs);transition:transform .1s}.qty button:active{transform:scale(.92)}
.qty b{font-size:30px;min-width:48px;text-align:center;font-weight:800}
.total{font-size:34px;font-weight:800;letter-spacing:-.03em}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,470px);background:var(--card);color:var(--txt);box-shadow:0 24px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(6,12,28,.55);backdrop-filter:blur(3px)}dialog h3{margin:0 0 8px;font-size:19px}
.end{display:flex;gap:10px;margin-top:16px}.end .btn{flex:1}
#lock{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}#lock.on{display:flex}#lock h2{color:#fff;font-size:22px;margin:0 0 4px;text-transform:none;letter-spacing:0}#lock p{opacity:.85;margin:0 0 16px;min-height:22px}
.dots{display:flex;gap:12px;margin:8px 0 18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{width:72px;height:72px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:24px;font-weight:600;cursor:pointer}.pad button:active{background:#ffffff55}
#lock .lnk{background:none;border:0;color:#fff;opacity:.8;margin-top:18px;text-decoration:underline;font-size:14px;cursor:pointer}
#planche{display:none}
#lockBtn{position:absolute;right:62px;top:calc(14px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:14px;background:#ffffff1f;border:1px solid #ffffff26;color:#fff;font-size:17px;cursor:pointer;padding:0;display:none;place-items:center}
.who{display:grid;gap:12px;width:min(340px,100%)}.who button{background:#ffffff1f;border:1px solid #ffffff2e;color:#fff;border-radius:18px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}.who small{display:block;font-weight:500;opacity:.8;font-size:13px;margin-top:2px}
#syncBtn{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:14px;background:#ffffff1f;border:1px solid #ffffff26;color:#fff;font-size:19px;cursor:pointer;padding:0;display:grid;place-items:center;backdrop-filter:blur(6px)}
#upd{position:fixed;left:12px;right:12px;bottom:96px;max-width:520px;margin:0 auto;z-index:30;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 12px 30px #0006}#upd span{flex:1;font-weight:600}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);background:#0c1a33ee;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:0 10px 26px #0005;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;color:#fff}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.9em}
::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}
@media print{header,nav,.noprint{display:none!important}body{padding:0;background:#fff}}
/* ---------- Printed tickets: A4, 4 x 10 = 40 tickets per page, cut lines, QR code ---------- */
@page tickets{size:A4;margin:8mm}
@media print{body.imprime>*:not(#planche){display:none!important}body.imprime{background:#fff;color:#000;padding:0}
body.imprime #planche{page:tickets;display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;grid-auto-rows:25mm;color:#1b2733;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tk{position:relative;overflow:hidden;break-inside:avoid;display:flex;flex-direction:column;text-align:left;border:.4mm solid var(--c,#0a1f44);border-radius:2.5mm;background:#fff;outline:.3mm dashed #9aa5b0;outline-offset:.9mm;font-family:Inter,Arial,sans-serif}
.tk-top{display:flex;align-items:center;gap:1.4mm;padding:.6mm 1.8mm;background:var(--c,#0a1f44);color:#fff}
.tk-logo{width:4.6mm;height:4.6mm;border-radius:1mm;background:#fff;padding:.3mm;object-fit:contain}
.tk-brand{flex:1;font-weight:800;font-size:9pt;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-price{background:#fff;color:var(--c,#0a1f44);font-weight:800;font-size:7.4pt;padding:.3mm 1.6mm;border-radius:10mm;white-space:nowrap}
.tk-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:1.2mm;padding:.4mm 1.6mm .5mm 1.8mm}
.tk-left{flex:1;min-width:0}
.tk-code{font:800 12pt ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#14171c;margin:0 0 .5mm;padding:.3mm 1.2mm;width:fit-content;border:.4mm dashed var(--c,#d85833);border-radius:1.4mm;background:color-mix(in srgb,var(--c,#d85833) 9%,#fff)}
.tk-plan{font-size:7.4pt;color:var(--c,#d85833);margin-bottom:.3mm;line-height:1.1}.tk-plan b{font-weight:800}
.tk-help{font-size:6.2pt;line-height:1.12;color:#3b4a58}
.tk-qr{flex:none;width:15mm;height:15mm}
.tk-test{font-size:6pt;font-weight:800;letter-spacing:.1em;color:#d85833}}

/* ---------- Report by seller ---------- */
.vbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 8px}.vbar i{display:block;height:100%;border-radius:99px;background:var(--g)}
.vdet{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;margin-top:6px}.vchip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.vdet.mut{color:var(--mut)}

/* ---------- Animated dashboard: page sky behind the content, sky inside the sales card ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#view{position:relative;z-index:1}
.hero .hsky{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hero>:not(.hsky){position:relative;z-index:2}
.hero.hanim::after{content:"";position:absolute;inset:-30% -40%;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(var(--fa,255,255,255),.14) 50%,transparent 58%);transform:translateX(-130%);animation:hsweep calc(8s / var(--tempo,1)) ease-in-out infinite}
@keyframes hsweep{0%,50%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.hero.hanim{box-shadow:0 14px 38px rgba(11,38,70,.34),0 0 0 1px rgba(255,255,255,.12) inset,0 0 46px rgba(var(--fa,62,198,255),.12)}
.hero.hanim small,.hero.hanim .delta{text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero.hanim .hero-num{text-shadow:0 0 26px rgba(var(--fa,110,190,255),.5),0 2px 12px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.hero.hanim::after{animation:none}}
@media print{#sky,.hsky{display:none!important}}

/* ---------- Design v2 (étape 1) : police, accueil, graphiques ---------- */
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2")}
.hero~.grid .stat:first-child,.hero~.grid .stat:nth-child(2){background:var(--card)}
.num,.stat b,.total,.hero-num,.row b{font-variant-numeric:tabular-nums}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:18px 18px 14px;margin-bottom:14px;background:radial-gradient(220px 140px at 100% 0%,rgba(246,196,83,.36),transparent 70%),radial-gradient(240px 160px at 0% 110%,rgba(79,140,255,.4),transparent 70%),linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 14px 34px rgba(10,31,68,.28)}
.hero small{opacity:.85;font-size:13px;font-weight:500}
.hero-greet{font-weight:800;font-size:17px;letter-spacing:-.01em;margin:1px 0 12px}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.delta{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.delta.up{background:rgba(62,207,142,.28)}.delta.down{background:rgba(255,107,107,.3)}
.spark{display:block;width:100%;height:48px;margin:10px 0 2px}
.hero .chips{background:transparent;border:0;box-shadow:none;padding:0;margin:10px 0 0;width:auto}
.hero .chip{background:rgba(255,255,255,.16);color:#fff;padding:6px 13px;font-size:13px}
.hero .chip.on{background:#fff;color:#0a1f44;box-shadow:none}
.cwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.cread{min-height:20px;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}.cread.on{color:var(--txt)}
.dwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dwrap svg{width:132px;height:132px;flex:none}
.dwrap svg .seg{cursor:pointer;transition:opacity .15s}.dwrap svg .seg.dim{opacity:.35}
.dleg{flex:1;min-width:150px;display:grid;gap:8px}
.dl{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.dl i{width:11px;height:11px;border-radius:4px;flex:none}.dl b{margin-left:auto}
.ccols{display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:1px solid var(--line)}
.ccol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;min-width:0}
.ccol i{display:block;width:100%;max-width:26px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc));min-height:2px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.ccol.pick i{background:linear-gradient(180deg,#f6c453,#e5a11f)}
.clabels{display:flex;gap:4px;margin-top:5px}.clabels span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);min-width:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){.ccol i{transition:none}}

/* ---------- Design v2 (étape 2) : vente, effets ---------- */
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
.sold-ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:9998;width:96px;height:96px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:52px;box-shadow:0 14px 40px rgba(31,111,235,.5);pointer-events:none;animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.today{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:12px 16px;margin-bottom:14px;box-shadow:0 10px 26px rgba(10,31,68,.25)}
.today b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.today small{opacity:.85;display:block;font-size:12.5px}.today span{margin-left:auto;font-size:26px}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;margin-right:10px;background:var(--c,var(--acc))}
.row .mode{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut);margin-right:4px}
.fo button,.card[data-a],.chip,nav button,.qty button,.btn{transition:transform .12s,box-shadow .15s,background .15s}
.chip:active,.card[data-a]:active,.qty button:active,nav button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.sold-ok{animation:none;opacity:0}.chip:active,.card[data-a]:active,.qty button:active,nav button:active{transform:none}}

/* ---------- Design v2 (étape 3) : ordinateur ---------- */
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 6px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);border-bottom-width:2px;color:inherit}
.keys>div{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}.keys>div span{margin-left:auto}
.nav-keys,.nav-brand{display:none}
@media (min-width:1024px){
  body{padding-left:236px;padding-bottom:28px}
  header{padding-left:28px;padding-right:28px;border-radius:0 0 22px 22px}
  header small{margin-left:48px}
  nav{left:0;right:auto;top:0;bottom:0;width:236px;max-width:none;margin:0;border-radius:0;border:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;gap:3px;padding:18px 12px;background:var(--card);backdrop-filter:none;box-shadow:none}
  .nav-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;padding:0 8px 14px}
  .nav-brand i{width:36px;height:36px;background:url(logo.svg) center/contain no-repeat;flex:none}
  nav button{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:15px;font-weight:600;padding:10px 12px;border-radius:12px}
  nav button b{font-size:19px;width:26px;text-align:center;margin:0;transform:none!important}
  nav button:hover{background:var(--bg2)}
  nav button.on{background:color-mix(in srgb,var(--acc) 14%,transparent);box-shadow:inset 3px 0 0 var(--acc)}
  nav button[data-v=tix]{background:var(--g);color:#fff}
  nav button[data-v=tix] b{background:none;border:0;box-shadow:none;margin:0;padding:0;font-size:19px;line-height:1}
  nav button[data-v=tix].on{box-shadow:0 6px 16px rgba(31,111,235,.4)}
  .nav-keys{display:flex;margin-top:auto;font-size:13px!important;font-weight:500!important;color:var(--mut)}
  .nav-keys kbd{margin-left:auto}
  main{max-width:1120px;padding:22px 28px 12px}
  main[data-v=sell],main[data-v=exp],main[data-v=day],main[data-v=tix],main[data-v=set]{max-width:760px}
  #toast{bottom:28px}
}
@media (min-width:1280px){
  main[data-v=home]{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  main[data-v=home]>*{grid-column:1/-1}
  main[data-v=home]>.blk{grid-column:auto}
  main[data-v=home]>.hero{padding:22px 26px 16px}
  main[data-v=home] .hero-num{font-size:48px}
  main[data-v=home]>.grid{grid-template-columns:repeat(2,1fr)}
}

/* ---------- Design v2 (étape 4) : rapport, clôture, réglages ---------- */
.hero .chip[disabled]{opacity:.4;cursor:default}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-pill{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.hero-pill.ok{background:rgba(62,207,142,.3)}.hero-pill.warn{background:rgba(246,196,83,.32)}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0 2px}
.hstats>div{background:rgba(255,255,255,.12);border-radius:14px;padding:9px 12px}
.hstats small{color:rgba(255,255,255,.82)!important;display:block}.hstats b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.hstats small{opacity:.82;font-size:12px}
.hstats .bad b{color:#ffb4a8}.hstats .ok b{color:#9ff0c6}
.sbadges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;border:0;font:600 12.5px inherit;cursor:default}
button.sbadge{cursor:pointer}.sbadge i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:12px}
.sbadge.ok{background:rgba(62,207,142,.28)}.sbadge.warn{background:rgba(246,196,83,.32)}
.shead{display:flex;align-items:center;gap:14px}.shead img{width:54px;height:54px;background:#fff;border-radius:14px;padding:5px;flex:none}.shead h2{display:block;margin:0;font-size:20px;font-weight:800;text-transform:none;letter-spacing:-.01em;color:#fff}.shead small{display:block}
@media print{.hero{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #999}.hero *{color:#000!important}.hero .chips,.hero .chip,.hstats>div{background:none!important}}
</style>
</head>
<body>
<header><button id="lockBtn" title="Verrouiller / changer de profil" aria-label="Verrouiller">🔒</button><button id="syncBtn" title="Synchronisation" aria-label="Synchronisation">☁️</button><h1 id="ttl">WiFi Zone</h1><small id="sub"></small></header>
<main id="view"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="planche"></div>
<div id="lock"></div>
<div id="toast"></div>
<script>
// WiFi Zone Manager: single-file PWA (sales of tickets, expenses, daily closing, reports). Data stays in this browser (localStorage).
(() => {
  'use strict';
  const $ = id => document.getElementById(id), KEY = 'wifizone-v1', VERSION = 'v41'; // VERSION must match CACHE in sw.js
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const fdate = s => s ? s.split('-').reverse().join('/') : '—';
  const nf = (n, d = 0) => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }).format(n).replace(/[  ]/g, ' ');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const MODEI = { 'Cash': '💵', 'M-Pesa': '📱', 'Airtel Money': '📱', 'Orange Money': '📱', 'Banque': '🏦' };
  const MODES = ['Cash', 'M-Pesa', 'Airtel Money', 'Orange Money', 'Banque'], CATS = ['Abonnement Starlink', 'Électricité / carburant', 'Salaire', 'Matériel / réparation', 'Papier / impression', 'Autre'];
  const blank = () => ({ v: 1, name: 'WiFi Zone', rate: 2400, lastBackup: '', pin: null, lockMin: 2, forfaits: [
    { id: 'V', nom: 'Visiteur', duree: '6 heures', prix: 500 }, { id: 'J', nom: 'Jour', duree: '24 heures', prix: 1000 },
    { id: 'S', nom: 'Semaine', duree: '7 jours', prix: 7000 }, { id: 'M', nom: 'Mois', duree: '30 jours', prix: 30000 }], sales: [], expenses: [], loans: [], closings: [], tickets: [], lots: [], users: [], noProfiles: false, server: 'hotspot-cispol', seuil: 10, ssid: 'WiFi Zone', loginHost: 'wifi.cispolstore' });
  let db; try { db = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { db = blank(); }
  // forfaits: stable order for sync, plus the ticket-code letter and the MikroTik profile (defaults follow the CISPOLstore router)
  const PROFILS = { V: 'Visiteur-6H', J: 'Jour-24H', S: 'Semaine-7J', M: 'Mois-30J' };
  db.forfaits.forEach((f, i) => { if (!f.ts) f.ts = i + 1; if (!f.letter) f.letter = (f.id in PROFILS) ? f.id : ''; if (f.profil == null) f.profil = PROFILS[f.id] || ''; });
  db.forfaits.forEach(f => { if (!f.letter) f.letter = freeLetter(f.nom, f); });
  function freeLetter(nom, self) { const used = new Set(db.forfaits.filter(x => x !== self).map(x => x.letter)); for (const c of (nom.toUpperCase().replace(/[^A-Z]/g, '') + 'ABCDEFGHJKLMNPQRSTUVWXYZ')) if (!used.has(c)) return c; return 'X'; }
  const save = () => { if (window.__afterSave) window.__afterSave(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Stockage plein : faites une sauvegarde'); } };
  const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); };
  // money: every record keeps its own currency and the rate of the day it was made
  const toCDF = (n, cur, rate) => cur === 'USD' ? n * (rate || db.rate) : n;
  const fmt = (n, cur = 'CDF') => cur === 'USD' ? `${nf(n, Math.abs(n % 1) > .004 ? 2 : 0)} $` : `${nf(n)} FC`;
  const usdOf = cdf => cdf / db.rate;
  const both = cdf => `${fmt(cdf)} <small>≈ ${fmt(usdOf(cdf), 'USD')}</small>`;

  const st = { tab: 'home', src: 'app', sper: 'day', sq: '', tfid: 'J', tn: 50, per: 'day', vper: 'month', lf: 'open', us: 'stock', ud: 'all', uff: 'all', uq: '', fid: '', qty: 1, mode: 'Cash', cd: today(), rm: today().slice(0, 7) };
  const range = per => { const t = today(); if (per === 'day') return [t, t]; if (per === 'week') return [addDays(t, -6), t]; return [t.slice(0, 7) + '-01', t]; };
  const inR = (d, r) => d >= r[0] && d <= r[1];
  const saleCDF = s => s.amount, expCDF = e => toCDF(e.amount, e.cur, e.rate);
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  // forfait colors follow the WiFi tools palette: green / blue / orange / purple, then cycling
  const FCOL = ['var(--f-v)', 'var(--f-j)', 'var(--f-s)', 'var(--f-m)'], FBYID = { V: 0, J: 1, S: 2, M: 3 };
  const fcol = f => FCOL[f.id in FBYID ? FBYID[f.id] : Math.max(0, db.forfaits.indexOf(f)) % 4];
  const fname = id => (db.forfaits.find(f => f.id === id) || { nom: 'Forfait supprimé' }).nom;

  // ---------- modal ----------
  const dlg = $('dlg');
  const modal = (title, body, onOk, okLabel = 'Enregistrer') => {
    dlg.oncancel = null;
    dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${body}<div class="end"><button type="button" class="btn sec" id="dno">${onOk ? 'Annuler' : 'Fermer'}</button>${onOk ? `<button class="btn" id="dok">${okLabel}</button>` : ''}</div></form>`;
    $('dno').onclick = () => dlg.close();
    dlg.querySelector('form').onsubmit = e => { e.preventDefault(); if (onOk && onOk() === false) return; dlg.close(); };
    if (!dlg.open) dlg.showModal();
  };
  const curTheme = () => { try { const t = localStorage.getItem('wifizone-theme'); return t === 'light' || t === 'dark' || t === 'noir' ? t : 'auto'; } catch (e) { return 'auto'; } };
  const applyTheme = t => { const el = document.documentElement; if (t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t); };
  const chips = (act, cur, items) => `<div class="chips">${items.map(([k, t]) => `<button class="chip ${cur === k ? 'on' : ''}" data-a="${act}" data-v="${esc(k)}">${esc(t)}</button>`).join('')}</div>`;

  // ---------- views ----------
  // ---------- small charts (no library) ----------
  const chartPick = e => { const el = e.target.closest('[data-ct]'); if (!el) return; const w = el.closest('.cwrap'), r = w && w.querySelector('.cread'); if (!r) return; r.textContent = el.getAttribute('data-ct'); r.classList.add('on'); w.querySelectorAll('.pick').forEach(x => x.classList.remove('pick')); el.classList.add('pick'); };
  document.addEventListener('click', chartPick);
  const donut = (items, centre) => { const list = items.filter(x => x.v > 0), tot = sum(list, x => x.v); if (!tot) return ''; const R = 42, L = 2 * Math.PI * R; let off = 0;
    const seg = list.map(x => { const len = x.v / tot * L, g = list.length > 1 ? 1.2 : 0, c = `<circle class="seg" cx="60" cy="60" r="${R}" fill="none" stroke="${x.c}" stroke-width="15" stroke-dasharray="${Math.max(0, len - g).toFixed(2)} ${(L - Math.max(0, len - g)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)" data-ct="${esc(x.l)} · ${esc(fmt(x.v))} (${Math.round(x.v / tot * 100)} %)"/>`; off += len; return c; }).join('');
    return `<div class="cwrap"><div class="cread" aria-live="polite">Touchez une part pour voir le détail</div><div class="dwrap"><svg viewBox="0 0 120 120" role="img" aria-label="Répartition des ventes par forfait"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="15"/>${seg}<text x="60" y="58" text-anchor="middle" font-size="9" fill="var(--mut)">${esc(centre)}</text><text x="60" y="71" text-anchor="middle" font-size="11" font-weight="800" fill="var(--txt)">${Math.round(tot / 1000) >= 1 ? nf(tot / 1000, 1) + ' k' : nf(tot)}</text></svg>
      <div class="dleg">${list.map(x => `<div class="dl" data-ct="${esc(x.l)} · ${esc(fmt(x.v))} (${Math.round(x.v / tot * 100)} %)"><i style="background:${x.c}"></i>${esc(x.l)}<b>${Math.round(x.v / tot * 100)} %</b></div>`).join('')}</div></div></div>`; };
  const barsChart = (items, title) => { const mx = Math.max(...items.map(x => x.v), 1); return `<div class="cwrap"><div class="cread" aria-live="polite">${esc(title)} · touchez une barre</div><div class="ccols">${items.map(x => `<div class="ccol" data-ct="${esc(x.t)} · ${esc(fmt(x.v))}"><i style="height:${Math.round(x.v / mx * 100)}%"></i></div>`).join('')}</div><div class="clabels">${items.map(x => `<span>${esc(x.l)}</span>`).join('')}</div></div>`; };
  const salesOn = (a, b) => sum(db.sales.filter(x => x.date >= a && x.date <= b), saleCDF);
  const daysOf = (a, b) => { const o = []; for (let k = a, n = 0; k <= b && n < 400; k = addDays(k, 1), n++) o.push(k); return o; };
  const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Bonjour ☀️' : h < 18 ? 'Bon après-midi 🌤️' : 'Bonsoir 🌙'; };
  // count-up on every [data-count] number that appears (skipped when the device asks for less motion)
  const countUp = el => { if (el.dataset.counted) return; el.dataset.counted = '1'; if (matchMedia('(prefers-reduced-motion:reduce)').matches) return; const to = +el.dataset.count, t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1 && document.body.contains(el)) requestAnimationFrame(step); else el.textContent = fmt(to); }; requestAnimationFrame(step); };
  { const v0 = $('view'); if (v0) new MutationObserver(() => v0.querySelectorAll('[data-count]:not([data-counted])').forEach(countUp)).observe(v0, { childList: true, subtree: true }); }
  const views = {};
  views.home = () => {
    if (!isMgr()) { const mine = db.sales.filter(x => x.date === today() && x.by === (me && me.name));
      return { title: db.name, sub: 'Bonjour ' + (me ? me.name : ''), html: `<button class="btn full" data-a="tab" data-v="sell" style="margin:0 0 12px">🎫 Vendre un ticket</button>${loanBanner()}
        <div class="grid"><div class="stat"><small>Mes ventes aujourd'hui</small><b class="ok">${fmt(sum(mine, saleCDF))}</b><small>${sum(mine, x => x.qty)} ticket(s)</small></div><div class="stat"><small>Tickets en stock</small><b>${db.tickets.filter(t => t.status === 'stock' && lotImported(t.lot)).length}</b></div></div>
        ${lowStock().length ? `<div class="card warn">🎟 Stock bas : ${lowStock().map(f => `${esc(f.nom)} (${stockOf(f.id).length})`).join(', ')}. Prévenez le gérant.</div>` : ''}` }; }
    const r = range(st.per), S = db.sales.filter(s => inR(s.date, r)), E = db.expenses.filter(e => inR(e.date, r));
    const inc = sum(S, saleCDF), out = sum(E, expCDF), net = inc - out, tickets = sum(S, s => s.qty);
    const byF = {}; S.forEach(s => { const o = byF[s.fid] = byF[s.fid] || { q: 0, a: 0 }; o.q += s.qty; o.a += s.amount; });
    const byM = {}; S.forEach(s => byM[s.mode] = (byM[s.mode] || 0) + s.amount);
    const bR = st.per === 'month' ? r : [addDays(today(), -6), today()], bars = daysOf(bR[0], bR[1]).map(k => ({ l: k.slice(8), t: fdate(k), v: salesOn(k, k) }));
    const pr = (() => { const el = Math.max(0, Math.round((new Date(r[1] + 'T12:00') - new Date(r[0] + 'T12:00')) / 864e5)); if (st.per === 'day') return [addDays(r[0], -1), addDays(r[0], -1)]; if (st.per === 'week') return [addDays(r[0], -7), addDays(r[0], -1)]; const a0 = iso(new Date(+r[0].slice(0, 4), +r[0].slice(5, 7) - 2, 1)); return [a0, addDays(a0, el)]; })();
    const prevInc = salesOn(pr[0], pr[1]), delta = prevInc > 0 ? (inc - prevInc) / prevInc * 100 : null, PL = { day: 'hier', week: 'les 7 jours précédents', month: 'le mois dernier' }[st.per];
    const spark = (() => { const v = bars.map(x => x.v), n = v.length; if (n < 2) return ''; const W = 200, H = 46, mx = Math.max(...v, 1), pts = v.map((y, i) => [Math.round(i / (n - 1) * W * 10) / 10, Math.round((H - 4 - y / mx * (H - 10)) * 10) / 10]), line = pts.map(q => q.join(',')).join(' '); return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${line} ${W},${H}" fill="url(#sg)"/><polyline points="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`; })();
    const stale = !db.lastBackup || (Date.now() - db.lastBackup) > 3 * 864e5;
    return { title: db.name, sub: fdate(r[0]) + (r[0] !== r[1] ? ' → ' + fdate(r[1]) : ''), html: `
      ${stale && (db.sales.length || db.expenses.length) ? `<div class="card warn" data-a="goset" style="cursor:pointer">⚠ Pas de sauvegarde récente. Touchez ici pour sauvegarder vos données.</div>` : ''}
      <button class="btn full" data-a="tab" data-v="tix" style="margin:0 0 12px">🎟 Générer des tickets <small style="font-weight:400">(stock : ${db.tickets.filter(t => t.status === 'stock' && lotImported(t.lot)).length})</small></button>
      ${dupBanner()}${pendBanner()}${loanBanner()}
      ${lowPaper().length ? `<div class="card warn" data-a="tab" data-v="tix" style="cursor:pointer">🖨️ Stock de tickets papier bas : ${lowPaper().map(f => `${esc(f.nom)} (${paperOf(f.id).length})`).join(', ')}.</div>` : ''}

      try { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('wifizone-')).map(k => caches.delete(k))); } catch (e) {}
      location.replace(location.pathname + '?maj=' + Date.now()); },
    reload: () => location.reload(),
    restore: () => $('rfile').click()
  };
  // ---------- keyboard shortcuts (computers) ----------
  const KEYS_NAV = { h: ['home', 'Accueil'], v: ['sell', 'Vendre'], t: ['tix', 'Tickets'], d: ['exp', 'Dépenses'], e: ['loan', 'Emprunts'], c: ['day', 'Clôture'], r: ['rep', 'Rapport'], s: ['set', 'Réglages'] };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEv = e; });
  window.addEventListener('appinstalled', () => { window.__installEv = null; toast('WiFi Zone est installée ✓'); });
  A.install = async () => {
    if (matchMedia('(display-mode: standalone)').matches) return toast("L'application est déjà installée");
    if (window.__installEv) { const ev = window.__installEv; window.__installEv = null; ev.prompt(); try { const r = await ev.userChoice; if (r.outcome === 'accepted') toast('Installation en cours…'); } catch (e) {} return; }
    modal('Installer WiFi Zone', '<p style="margin-top:0">Le navigateur ne propose pas encore l\'installation. Dans <b>Chrome</b> : touchez ⋮ (en haut à droite), puis <b>« Installer l\'application »</b>.</p><p class="mut">Si ce choix n\'existe pas : ouvrez cette page dans Chrome (pas dans une application intégrée), attendez qu\'elle soit entièrement chargée, rechargez-la une fois, puis rouvrez le menu.</p>');
  };
  A.keys = () => modal('⌨ Raccourcis clavier', `<div class="keys"><h2 style="margin:6px 0">Aller à</h2>${Object.entries(KEYS_NAV).filter(([, [v]]) => canView(v)).map(([k, [, t]]) => `<div><kbd>${k.toUpperCase()}</kbd><span>${t}</span></div>`).join('')}<h2 style="margin:14px 0 6px">Sur l'écran Vendre</h2><div><kbd>+</kbd> <kbd>−</kbd><span>Quantité</span></div><div><kbd>1</kbd>…<kbd>9</kbd><span>Choisir le forfait</span></div><div><kbd>Entrée</kbd><span>Enregistrer la vente</span></div><h2 style="margin:14px 0 6px">Partout</h2><div><kbd>?</kbd><span>Cette aide</span></div><div><kbd>Échap</kbd><span>Fermer la fenêtre</span></div></div>`);
  document.addEventListener('keydown', e => {
    const t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if (dlg.open || e.ctrlKey || e.metaKey || e.altKey || (lockEl && lockEl.classList.contains('on'))) return;
    const k = e.key, kl = k.toLowerCase();
    if (k === '?') { e.preventDefault(); return A.keys(); }
    if (KEYS_NAV[kl] && canView(KEYS_NAV[kl][0])) { e.preventDefault(); return A.tab(KEYS_NAV[kl][0]); }
    if (st.tab === 'sell') {
      if (k === '+' || k === '=') { e.preventDefault(); return A.qty('1'); }
      if (k === '-') { e.preventDefault(); return A.qty('-1'); }
      if (/^[1-9]$/.test(k) && db.forfaits[+k - 1]) { e.preventDefault(); return A.fid(db.forfaits[+k - 1].id); }
      if (k === 'Enter' && st.fid) { e.preventDefault(); return A.sell(); }
    }
  });
  document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) { if (!canAct(b.dataset.a)) return toast('Action réservée au gérant'); A[b.dataset.a](b.dataset.v); } });
  document.addEventListener('change', e => {
    if (e.target.id === 'ifile' && e.target.files[0]) {
      const mode = $('i_mode').value, rd = new FileReader();
      rd.onload = () => { try { const x = importSales(String(rd.result), mode); draw(); toast(x.added ? `${x.added} vente(s) importée(s) : ${fmt(x.total)}${x.dup ? ` · ${x.dup} déjà présente(s)` : ''}${x.newF ? ` · ${x.newF} forfait(s) créé(s)` : ''}` : `Rien à importer${x.dup ? ` (${x.dup} déjà présente(s))` : ''}`); } catch (er) { toast(er.message || 'Fichier invalide'); } };
      rd.readAsText(e.target.files[0]); e.target.value = ''; return;
    }
    if (e.target.id === 's_lock') { db.lockMin = +e.target.value; save(); toast('Enregistré'); return; }
    if (e.target.id !== 'rfile' || !e.target.files[0]) return;
    const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!Array.isArray(d.sales) || !Array.isArray(d.expenses)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.sales.length} vente(s), ${d.expenses.length} dépense(s)) ?`)) return; db = { ...blank(), ...d, pin: db.pin, lockMin: db.lockMin }; save(); draw(); toast('Sauvegarde restaurée'); } catch (x) { toast('Fichier invalide'); } };
    rd.readAsText(e.target.files[0]); e.target.value = '';
  });
  { const lb = $('lockBtn'); if (lb) lb.onclick = () => A.lockn(); }
  const sb = $('syncBtn'); if (sb) { setStatus(SY.status); sb.onclick = () => { if (!cfg) A.tab('set'); else A.syncnow(); }; }
  // App shortcuts (long-press menu on Android): ?go=<screen>; an unknown screen is ignored and a profile without access falls back to Vendre after sign-in
  { const g = new URLSearchParams(location.search).get('go'); if (g && views[g] && g !== 'sales') st.tab = g; }
  draw(); unlockScreen(); if (cfg) schedule(1500);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // a new version was installed in the background: offer to reload (the open page still shows the old one)
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { const first = !hadController; hadController = true; if (!first && !$('upd')) { const d = document.createElement('div'); d.id = 'upd'; d.className = 'noprint'; d.innerHTML = '<span>Nouvelle version disponible</span><button class="btn sm" data-a="reload">Actualiser</button>'; document.body.appendChild(d); } });
    navigator.serviceWorker.register('sw.js').then(reg => reg.update().catch(() => {})).catch(() => {});
  }
})();
</script>
