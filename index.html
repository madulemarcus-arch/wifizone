<style>

<body>
<header><button id="lockBtn" title="Verrouiller / changer de profil" aria-label="Verrouiller">🔒</button><button id="syncBtn" title="Synchronisation" aria-label="Synchronisation">☁️</button><h1 id="ttl">WiFi Zone</h1><small id="sub"></small></header>
<main id="view"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="planche"></div>
<div id="lock"></div>
<div id="toast"></div>
<script>
// WiFi Zone Manager: single-file PWA (sales of tickets, expenses, daily closing, reports). Data stays in this browser (localStorage).
(() => {
  'use strict';
  const $ = id => document.getElementById(id), KEY = 'wifizone-v1', VERSION = 'v22'; // VERSION must match CACHE in sw.js
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const fdate = s => s ? s.split('-').reverse().join('/') : '—';
  const nf = (n, d = 0) => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }).format(n).replace(/[  ]/g, ' ');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const MODES = ['Cash', 'M-Pesa', 'Airtel Money', 'Orange Money', 'Banque'], CATS = ['Abonnement Starlink', 'Électricité / carburant', 'Salaire', 'Matériel / réparation', 'Papier / impression', 'Autre'];
  const blank = () => ({ v: 1, name: 'WiFi Zone', rate: 2400, lastBackup: '', pin: null, lockMin: 2, forfaits: [
    { id: 'V', nom: 'Visiteur', duree: '6 heures', prix: 500 }, { id: 'J', nom: 'Jour', duree: '24 heures', prix: 1000 },
    { id: 'S', nom: 'Semaine', duree: '7 jours', prix: 7000 }, { id: 'M', nom: 'Mois', duree: '30 jours', prix: 30000 }], sales: [], expenses: [], closings: [], tickets: [], lots: [], users: [], noProfiles: false, server: 'hotspot-cispol', seuil: 10 });
  let db; try { db = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { db = blank(); }
  // forfaits: stable order for sync, plus the ticket-code letter and the MikroTik profile (defaults follow the CISPOLstore router)
  const PROFILS = { V: 'Visiteur-6H', J: 'Jour-24H', S: 'Semaine-7J', M: 'Mois-30J' };
  db.forfaits.forEach((f, i) => { if (!f.ts) f.ts = i + 1; if (!f.letter) f.letter = (f.id in PROFILS) ? f.id : ''; if (f.profil == null) f.profil = PROFILS[f.id] || ''; });
  db.forfaits.forEach(f => { if (!f.letter) f.letter = freeLetter(f.nom, f); });
  function freeLetter(nom, self) { const used = new Set(db.forfaits.filter(x => x !== self).map(x => x.letter)); for (const c of (nom.toUpperCase().replace(/[^A-Z]/g, '') + 'ABCDEFGHJKLMNPQRSTUVWXYZ')) if (!used.has(c)) return c; return 'X'; }
  const save = () => { if (window.__afterSave) window.__afterSave(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Stockage plein : faites une sauvegarde'); } };
  const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); };
  // money: every record keeps its own currency and the rate of the day it was made
  const toCDF = (n, cur, rate) => cur === 'USD' ? n * (rate || db.rate) : n;

    rows.slice(1).forEach((c, i) => {
      const m = (c[cD] || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/), prix = Math.round(+String(c[cP] || '').replace(/[\s\u202f\u00a0]/g, '').replace(',', '.'));
      if (!m || !(prix >= 0) || !c[cF]) return;
      const date = `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`, code = cC >= 0 ? c[cC] : '', id = code ? 'caisse-' + code : `caisse-${date}-${cH >= 0 ? c[cH] : ''}-${i}-${prix}`;
      if (have.has(id)) { dup++; return; }
      let f = db.forfaits.find(x => x.nom.toLowerCase() === c[cF].toLowerCase());
      if (!f) { f = { id: uid(), ts: Date.now() + newF, nom: c[cF], duree: '', prix }; db.forfaits.push(f); newF++; }
      db.sales.push({ id, ts: new Date(date + 'T' + ((cH >= 0 && c[cH]) || '12:00').replace('h', ':') + ':00').getTime() || Date.now(), date, fid: f.id, qty: 1, amount: prix, mode, ref: code, note: cV >= 0 && c[cV] ? 'vendeur ' + c[cV] : 'caisse', src: 'caisse' });
      if (code) { const tk = db.tickets.find(x => x.code === code && x.status === 'stock'); if (tk) { tk.status = 'sold'; tk.saleId = id; tk.soldAt = Date.now(); } }
      have.add(id); added++; total += prix;
    });
    save(); return { added, dup, newF, total };
  };

  // ---------- actions ----------
  const share = t => window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
  const copy = t => { const ok = () => toast('Copié'); try { navigator.clipboard.writeText(t).then(ok, () => prompt('Copiez :', t)); } catch (e) { prompt('Copiez :', t); } };
  const download = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const forfaitForm = f => modal(f ? 'Modifier le forfait' : 'Nouveau forfait', `<label>Nom</label><input id="f_nom" value="${esc(f ? f.nom : '')}"><label>Durée (ex. 24 heures)</label><input id="f_duree" value="${esc(f ? f.duree : '')}"><label>Prix (FC)</label><input id="f_prix" type="number" inputmode="numeric" min="0" value="${f ? f.prix : ''}"><label>Lettre du code (1re lettre des tickets)</label><input id="f_letter" maxlength="1" value="${esc(f ? f.letter : '')}" style="text-transform:uppercase"><label>Profil MikroTik (nom exact sur le routeur)</label><input id="f_profil" value="${esc(f ? f.profil : '')}" placeholder="Ex. Jour-24H" autocapitalize="none">${f ? '<button type="button" class="btn del full" id="f_del">Supprimer ce forfait</button>' : ''}`, () => {
    const nom = $('f_nom').value.trim(), prix = +$('f_prix').value; if (!nom || !(prix >= 0) || $('f_prix').value === '') { toast('Nom et prix requis'); return false; }
    const letter = ($('f_letter').value.trim().toUpperCase().replace(/[^A-Z]/g, '') || freeLetter(nom, f)).slice(0, 1), profil = $('f_profil').value.trim();
    if (db.forfaits.some(x => x !== f && x.letter === letter)) { toast(`La lettre ${letter} est déjà prise par un autre forfait`); return false; }
    if (f) { if (f.letter !== letter && hasLots(f.id)) { toast('La lettre ne peut plus changer : des tickets existent déjà'); return false; } Object.assign(f, { nom, duree: $('f_duree').value.trim(), prix, letter, profil }); } else db.forfaits.push({ id: uid(), ts: Date.now(), nom, duree: $('f_duree').value.trim(), prix, letter, profil });
    save(); draw();
  }) || (f && ($('f_del').onclick = () => { if (confirm('Supprimer ce forfait ? Les anciennes ventes sont conservées.')) { db.forfaits = db.forfaits.filter(x => x !== f); if (st.fid === f.id) st.fid = ''; save(); dlg.close(); draw(); } }));
  const A = {
    tab: v => { st.tab = v; draw(); window.scrollTo(0, 0); }, per: v => { st.per = v; draw(); }, goset: () => A.tab('set'),
    fid: v => { st.fid = v; draw(); }, qty: v => { st.qty = Math.max(1, st.qty + +v); draw(); }, mode: v => { st.mode = v; draw(); },
    theme: v => { const t = ['light', 'dark', 'noir'].includes(v) ? v : 'auto'; try { if (t === 'auto') localStorage.removeItem('wifizone-theme'); else localStorage.setItem('wifizone-theme', t); } catch (e) {} applyTheme(t); draw(); },
    src: v => { st.src = v === 'paper' ? 'paper' : 'app'; draw(); },
    sell: () => { const f = db.forfaits.find(x => x.id === st.fid); if (!f) return;
      if (st.src === 'paper') { // a paper ticket: the money is counted, no code is shown; with a code, that exact ticket leaves the paper stock
        const code = ($('pcode') ? $('pcode').value : '').trim().toUpperCase(), avail = paperOf(f.id).sort((a, b) => a.ts - b.ts); let take = [];
        if (code) { const tk = avail.find(t => t.code === code); if (!tk) return toast('Ce code n\'est pas un ticket papier en stock pour ce forfait (déjà vendu, inconnu, ou ticket de l\'application)'); take = [tk]; }
        else if (hasPaper(f.id)) { take = avail.slice(0, st.qty); if (take.length < st.qty && !confirm(`Il ne reste que ${take.length} ticket(s) papier ${f.nom} en stock pour ${st.qty} demandé(s). Vendre quand même ?`)) return; }
        const id = uid(); db.sales.push({ id, ts: Date.now(), date: today(), fid: f.id, qty: st.qty, amount: f.prix * st.qty, mode: st.mode, ref: code, codes: code ? [code] : [], anonCodes: code ? [] : take.map(t => t.code), paper: true, note: '', by: me ? me.name : '' });
        take.forEach(t => { t.status = 'sold'; t.saleId = id; t.soldAt = Date.now(); });
        save(); toast(`Vente papier enregistrée : ${fmt(f.prix * st.qty)}`); st.qty = 1; return draw(); }
      const avail = stockOf(f.id).sort(() => Math.random() - .5), take = avail.slice(0, st.qty); // random pick: two phones selling offline rarely take the same code
      if (hasLots(f.id) && take.length < st.qty && !confirm(`Il ne reste que ${take.length} ticket(s) ${f.nom} en stock pour ${st.qty} demandé(s). Vendre quand même, sans code pour les autres ?`)) return;
      const id = uid(); db.sales.push({ id, ts: Date.now(), date: today(), fid: f.id, qty: st.qty, amount: f.prix * st.qty, mode: st.mode, ref: take.map(t => t.code).join(' '), codes: take.map(t => t.code), note: '', by: me ? me.name : '' });
      take.forEach(t => { t.status = 'sold'; t.saleId = id; t.soldAt = Date.now(); });
      save(); toast(`Vente enregistrée : ${fmt(f.prix * st.qty)}`); st.qty = 1; draw(); if (take.length) showCodes(f, take.map(t => t.code)); },
    delsale: v => { const s = db.sales.find(x => x.id === v); if (s && confirm(`Supprimer cette vente de ${fmt(s.amount)} ?${(s.codes || []).length ? ' Les codes ' + s.codes.join(', ') + ' retournent en stock.' : ''}`)) { (s.codes || []).concat(s.anonCodes || []).forEach(c => { const t = db.tickets.find(x => x.code === c); if (t) { t.status = 'stock'; delete t.saleId; delete t.soldAt; } }); db.sales = db.sales.filter(x => x !== s); save(); draw(); } },
    newexp: () => modal('Nouvelle dépense', `<label>Libellé</label><input id="e_label" placeholder="Ex. Recharge Starlink"><label>Catégorie</label><select id="e_cat">${CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select>
      <div style="display:flex;gap:8px"><div style="flex:2"><label>Montant</label><input id="e_amt" type="number" inputmode="decimal" min="0"></div><div style="flex:1"><label>Devise</label><select id="e_cur"><option>CDF</option><option>USD</option></select></div></div>
      <label>Payé par</label><select id="e_mode">${MODES.map(m => `<option>${esc(m)}</option>`).join('')}</select><label>Date</label><input id="e_date" type="date" value="${today()}" max="${today()}">`, () => {
      const amount = +$('e_amt').value; if (!(amount > 0)) { toast('Montant invalide'); return false; }
      db.expenses.push({ id: uid(), ts: Date.now(), date: $('e_date').value || today(), label: $('e_label').value.trim(), cat: $('e_cat').value, amount, cur: $('e_cur').value, rate: db.rate, mode: $('e_mode').value }); save(); draw(); toast('Dépense enregistrée');
    }),
    delexp: v => { const e = db.expenses.find(x => x.id === v); if (e && confirm(`Supprimer cette dépense de ${fmt(e.amount, e.cur)} ?`)) { db.expenses = db.expenses.filter(x => x !== e); save(); draw(); } },
    dnav: v => { const n = addDays(st.cd, +v); if (n <= today()) { st.cd = n; draw(); } },
    close: () => { const raw = $('ccount').value; if (raw === '') return toast('Saisissez le cash compté'); const x = dayData(st.cd), counted = +raw, diff = Math.round(counted - x.cash.CDF);
      db.closings = db.closings.filter(c => c.date !== st.cd); db.closings.push({ date: st.cd, ts: Date.now(), expected: x.cash.CDF, counted, diff, note: $('cnote').value.trim() }); save(); draw(); toast('Journée clôturée'); },
    reopen: () => { if (confirm('Rouvrir cette journée ?')) { db.closings = db.closings.filter(c => c.date !== st.cd); save(); draw(); } },
    dwa: () => share(dayText(dayData(st.cd))), dcopy: () => copy(dayText(dayData(st.cd))), print: () => window.print(),
    mnav: v => { const d = new Date(st.rm + '-15T12:00:00'); d.setMonth(d.getMonth() + +v); const n = iso(d).slice(0, 7); if (n <= today().slice(0, 7)) { st.rm = n; draw(); } },
    mwa: () => share(monthText(monthData(st.rm))),
    sper: v => { st.sper = v; draw(); },
    salescsv: () => { const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, l = salesFiltered().slice().reverse();
      download(`wifizone-ventes-${st.sper}-${today()}.csv`, '\ufeff' + [['Date', 'Heure', 'Forfait', 'Quantité', 'Code', 'Support', 'Mode', 'Vendeur', 'Montant FC', 'Note'], ...l.map(x => [x.date, hhmm(x.ts), fname(x.fid), x.qty, x.ref || '', x.paper ? 'Papier' : 'Application', x.mode, x.by || '', x.amount, x.note || ''])].map(r => r.map(q).join(';')).join('\n'), 'text/csv'); },
    csv: () => { const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, x = monthData(st.rm), rows = [['Date', 'Heure', 'Type', 'Libellé', 'Code', 'Mode', 'Devise', 'Montant', 'Équivalent FC'],
      ...x.S.map(s => [s.date, hhmm(s.ts), 'Vente', `${s.qty} × ${fname(s.fid)}`, s.ref || '', s.mode, 'CDF', s.amount, s.amount]), ...x.E.map(e => [e.date, hhmm(e.ts || 0), 'Dépense', e.label || e.cat, '', e.mode, e.cur, -e.amount, -expCDF(e)])].sort((a, b) => a[0].localeCompare(b[0]));
      download(`wifizone-${st.rm}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv'); },
    saveset: () => { const r = Math.round(+$('s_rate').value); if (!(r > 0)) return toast('Taux invalide'); db.name = $('s_name').value.trim() || 'WiFi Zone'; db.rate = r; db.server = $('s_server').value.trim() || 'hotspot-cispol'; db.seuil = Math.max(0, parseInt($('s_seuil').value, 10) || 0); save(); draw(); toast('Réglages enregistrés'); },
    newf: () => forfaitForm(null), editf: v => forfaitForm(db.forfaits.find(f => f.id === v)),
    backup: () => { db.lastBackup = Date.now(); save(); download(`wifizone-sauvegarde-${today()}.json`, JSON.stringify({ ...db, pin: null }), 'application/json'); draw(); toast('Sauvegarde téléchargée'); },
    impcsv: () => $('ifile').click(),
    fixdup: () => { const d = dupSales(), done = [];
      d.forEach(({ sale, code }) => { const f = db.forfaits.find(x => x.id === sale.fid), nt = f && stockOf(f.id)[0]; if (!nt) return; nt.status = 'sold'; nt.saleId = sale.id; nt.soldAt = Date.now(); sale.codes = sale.codes.map(c => c === code ? nt.code : c); sale.ref = sale.codes.join(' '); done.push({ f, code: nt.code, old: code }); });
      save(); draw(); if (!done.length) return toast('Plus de ticket en stock : générez un lot');
      modal('Nouveaux codes à donner', `<p class="mut" style="margin-top:0">Ces clients avaient reçu un code déjà vendu. Donnez-leur le nouveau code :</p>${done.map(x => `<div class="row"><div class="g"><small>${esc(x.f.nom)} · remplace ${esc(x.old)}</small></div><b style="font-family:monospace;font-size:20px">${esc(x.code)}</b></div>`).join('')}`); },
    genlot: () => { const f = db.forfaits.find(x => x.id === $('t_f').value), n = Math.min(300, Math.max(1, parseInt($('t_n').value, 10) || 0)); if (!f) return;
      if (!f.profil) return toast('Renseignez d\'abord le profil MikroTik de ce forfait (Réglages → ✎)'); st.tfid = f.id; st.tn = n; st.tdest = $('t_dest').value === 'paper' ? 'paper' : 'app';
      const lot = genLot(f, n, st.tdest); draw(); download(`tickets-${f.nom}-${lot.id}.rsc`, rscOf(f, lot), 'text/plain;charset=utf-8'); toast(`${n} tickets ${st.tdest === 'paper' ? 'papier ' : ''}${f.nom} générés : importez le fichier .rsc dans le routeur${st.tdest === 'paper' ? ', puis imprimez-les' : ''}`); },
    lotimp: v => { const l = db.lots.find(x => x.id === v); if (!l) return;
      if (l.imported === false) { l.imported = true; l.importedAt = Date.now(); save(); draw(); return toast('Lot importé : ses tickets sont maintenant en vente'); }
      if (db.tickets.some(t => t.lot === l.id && t.status === 'sold')) { draw(); return toast('Des tickets de ce lot sont déjà vendus : on ne peut plus le repasser « à importer »'); }
      l.imported = false; delete l.importedAt; save(); draw(); },
    lotrsc: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (f) download(`tickets-${f.nom}-${l.id}.rsc`, rscOf(f, l), 'text/plain;charset=utf-8'); },
    lotprint: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (!f) return; if (l.dest !== 'paper') return toast('Les tickets de l\'application ne s\'impriment pas : générez un lot « papier »'); printLot(f, l); },
    // delete a lot nothing was sold from; if it was imported into the router, a cleanup .rsc removes its codes there too
    lotdel: v => { const l = db.lots.find(x => x.id === v); if (!l) return; const f = db.forfaits.find(x => x.id === l.fid) || { nom: 'forfait' }, tk = lotCodes(l.id);
      if (tk.some(t => t.status === 'sold')) return toast(`Impossible : ${tk.filter(t => t.status === 'sold').length} ticket(s) de ce lot sont déjà vendus`);
      const inRouter = l.imported !== false;
      if (!confirm(`Supprimer le lot ${f.nom} × ${tk.length} ? Ses codes seront retirés de l'application (et des autres appareils synchronisés).${inRouter ? '\n\nCe lot a été importé dans le routeur : un fichier de nettoyage .rsc va être téléchargé. Importez-le dans le routeur pour y supprimer aussi ces codes.' : ''}`)) return;
      if (inRouter) download(`supprimer-lot-${f.nom}-${l.id}.rsc`, ['# Suppression du lot ' + l.id + ' - ' + f.nom + ' - ' + tk.length + ' tickets', ...tk.map(t => `/ip hotspot user remove [find where name=${t.code}]`)].join('\n') + '\n', 'text/plain;charset=utf-8');
      db.tickets = db.tickets.filter(t => t.lot !== l.id); db.lots = db.lots.filter(x => x !== l); save(); draw(); toast(inRouter ? 'Lot supprimé : importez le fichier de nettoyage dans le routeur' : 'Lot supprimé'); },
    lotcsv: v => { const l = db.lots.find(x => x.id === v), f = l && db.forfaits.find(x => x.id === l.fid); if (f) download(`tickets-${f.nom}-${l.id}.csv`, '\ufeff' + ['Code;Forfait;Prix FC;Statut', ...lotCodes(l.id).map(t => `${t.code};${f.nom};${f.prix};${t.status === 'sold' ? 'Vendu' : 'En stock'}`)].join('\n'), 'text/csv'); },
    syncnow: async () => { toast('Synchronisation…'); toast(await SY.now()); },
    syncoff: () => { if (confirm('Déconnecter la synchronisation ? Les données restent sur ce téléphone.')) { SY.disconnect(); draw(); } },
    syncsql: () => { fetch('sync/supabase.sql').then(r => r.text()).then(t => { try { navigator.clipboard.writeText(t); toast('Script SQL copié'); } catch (e) { toast('Copie impossible'); } }).catch(() => toast('Script indisponible')); },
    syncsetup: () => modal('Synchronisation', `<div class="card" style="font-size:14px"><b>Déjà configuré pour CISPOLstore Manager ?</b> Utilisez la même URL et la même clé, avec le nom d'espace <b>wifizone</b> : rien d'autre à faire.<br><br><b>Sinon (une seule fois, 5 minutes)</b>
        <ol style="margin:8px 0 0;padding-left:18px"><li>Compte gratuit sur <b>supabase.com</b>, puis un nouveau projet.</li><li><b>SQL Editor</b> → New query → collez le script → <b>Run</b>.</li><li><b>Project Settings → API</b> : copiez l'URL du projet et la clé <b>anon / publishable</b>.</li></ol>
        <div class="bar"><button type="button" class="btn sec sm" data-a="syncsql">📋 Copier le script SQL</button></div><p style="margin-bottom:0">Sur chaque autre téléphone, saisissez <b>exactement les mêmes 4 valeurs</b>.</p></div>
        <label>URL du projet Supabase</label><input id="y_url" value="${esc(cfg ? cfg.url : '')}" placeholder="https://xxxx.supabase.co" autocapitalize="none" autocomplete="off">
        <label>Clé publique (anon / publishable)</label><input id="y_anon" value="${esc(cfg ? cfg.anon : '')}" autocapitalize="none" autocomplete="off">
        <label>Nom de l'espace</label><input id="y_ws" value="${esc(cfg ? cfg.ws : 'wifizone')}" autocapitalize="none" autocomplete="off">
        <label>Phrase secrète (8 caractères minimum)</label><input id="y_pass" type="password" autocomplete="off">
        <p class="mut" style="font-size:13px">Les données sont chiffrées avec cette phrase avant l'envoi : sans elle, personne (même Supabase) ne peut les lire. <b>Notez-la</b> : elle ne peut pas être récupérée.</p><p id="y_msg" class="warn"></p>`, () => {
        const msg = $('y_msg'), btn = $('dok'); msg.textContent = ''; btn.disabled = true; btn.textContent = 'Connexion…';
        SY.connect({ url: $('y_url').value, anon: $('y_anon').value, ws: $('y_ws').value, pass: $('y_pass').value }).then(r => { dlg.close(); toast('Synchronisation activée : ' + r); draw(); }).catch(e => { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Connecter'; });
        return false; }, 'Connecter'),
    uson: () => userForm(null, 'first', true),
    usnew: () => userForm(null, gerants().length < MING ? 'second' : 'vendeur'),
    usnewg: () => { if (gerants().length >= MAXG) return toast(`${MAXG} gérants au maximum`); userForm(null, 'gerant'); },
    usedit: v => userForm(db.users.find(x => x.id === v), false),
    usoff: () => { if (!confirm('Désactiver les profils ? Tout le monde aura de nouveau tous les droits, sans code PIN de profil.')) return; db.users = []; db.noProfiles = true; me = null; save(); draw(); toast('Profils désactivés'); },
    setpin: () => verifyThen(newPin), lockn: () => unlockScreen(), rmpin: () => verifyThen(() => { if (confirm('Supprimer le code PIN ?')) { db.pin = null; save(); draw(); toast('Code PIN supprimé'); } else draw(); }),
    // forget the cached copy of the app (service worker + caches, never the data) and reload the latest version
    update: async () => { toast('Mise à jour…');
      try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(x => x.unregister())); } catch (e) {}
      try { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('wifizone-')).map(k => caches.delete(k))); } catch (e) {}
      location.replace(location.pathname + '?maj=' + Date.now()); },
    reload: () => location.reload(),
    restore: () => $('rfile').click()
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) { if (!canAct(b.dataset.a)) return toast('Action réservée au gérant'); A[b.dataset.a](b.dataset.v); } });
  document.addEventListener('change', e => {
    if (e.target.id === 'ifile' && e.target.files[0]) {
      const mode = $('i_mode').value, rd = new FileReader();
      rd.onload = () => { try { const x = importSales(String(rd.result), mode); draw(); toast(x.added ? `${x.added} vente(s) importée(s) : ${fmt(x.total)}${x.dup ? ` · ${x.dup} déjà présente(s)` : ''}${x.newF ? ` · ${x.newF} forfait(s) créé(s)` : ''}` : `Rien à importer${x.dup ? ` (${x.dup} déjà présente(s))` : ''}`); } catch (er) { toast(er.message || 'Fichier invalide'); } };
      rd.readAsText(e.target.files[0]); e.target.value = ''; return;
    }
    if (e.target.id === 's_lock') { db.lockMin = +e.target.value; save(); toast('Enregistré'); return; }
    if (e.target.id !== 'rfile' || !e.target.files[0]) return;
    const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!Array.isArray(d.sales) || !Array.isArray(d.expenses)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.sales.length} vente(s), ${d.expenses.length} dépense(s)) ?`)) return; db = { ...blank(), ...d, pin: db.pin, lockMin: db.lockMin }; save(); draw(); toast('Sauvegarde restaurée'); } catch (x) { toast('Fichier invalide'); } };
    rd.readAsText(e.target.files[0]); e.target.value = '';
  });
  { const lb = $('lockBtn'); if (lb) lb.onclick = () => A.lockn(); }
  const sb = $('syncBtn'); if (sb) { setStatus(SY.status); sb.onclick = () => { if (!cfg) A.tab('set'); else A.syncnow(); }; }
  draw(); unlockScreen(); if (cfg) schedule(1500);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // a new version was installed in the background: offer to reload (the open page still shows the old one)
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { const first = !hadController; hadController = true; if (!first && !$('upd')) { const d = document.createElement('div'); d.id = 'upd'; d.className = 'noprint'; d.innerHTML = '<span>Nouvelle version disponible</span><button class="btn sm" data-a="reload">Actualiser</button>'; document.body.appendChild(d); } });
    navigator.serviceWorker.register('sw.js').then(reg => reg.update().catch(() => {})).catch(() => {});
  }
})();
</script>
